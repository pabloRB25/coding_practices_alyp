# Gate DEV — red mínima sobre la rama de trabajo.
#
# NO es bloqueante y NO es el gate que valida el cambio: eso lo hace el gate
# local (`pnpm verify:full`, mismo set que el Gate STG, code-standard I2).
# Este workflow existe para que `develop` no acumule roto entre promociones
# cuando alguien no corrió el gate local. Barato a propósito: ~4 min.
name: Gate DEV

on:
  pull_request:
    branches: [develop]

concurrency:
  group: gate-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-dev:
    name: Gate DEV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # NO especificar version: — lee packageManager de package.json automáticamente

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + test)
        run: pnpm turbo run verify

      - name: Build
        run: pnpm turbo run build
