# Alyp Studio — Secret scan (bloquea PRs que filtran secretos)
#
# Escanea el repo en busca de firmas de secreto de alta confianza: claves
# privadas, llaves AWS/OpenAI, service_role de Supabase, asignaciones de
# token/password en código, y ficheros `.env` reales commiteados.
#
# Falsos positivos legítimos van a `.github/secret-scan-allowlist.txt`
# (una subcadena literal por línea, NO regex). NO agregues secretos reales ahí:
# rotá el secreto y arreglá la fuente.
#
# Gotcha: el único path excluido es ESTE workflow y su allowlist. No excluyas
# `.github/workflows` entero — es el área más sensible del repo.

name: Secret scan

on:
  push:
    branches: [main, staging, develop]
  pull_request:

permissions:
  contents: read

jobs:
  scan-secrets:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run secret scan
        run: |
          set -euo pipefail

          ALLOWLIST=".github/secret-scan-allowlist.txt"

          # Firmas de secreto de alta confianza (bajo falso-positivo).
          # Sin comillas simples dentro de los patrones (quoting robusto).
          PATTERNS=(
            # Claves privadas (RSA/EC/OpenSSH/PGP)
            '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----'
            # AWS access key id
            '\bAKIA[0-9A-Z]{16}\b'
            # OpenAI / Anthropic style API keys
            '\bsk-[A-Za-z0-9_-]{20,}\b'
            'sk-ant-[A-Za-z0-9_-]{20,}'
            # Supabase service_role (NUNCA en cliente; el anon key sí es público)
            'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*"?ey[A-Za-z0-9_.-]{20,}'
            '"role"[[:space:]]*:[[:space:]]*"service_role"'
            # Asignación genérica de secreto con valor de alta entropía
            '(secret|token|password|api[_-]?key)[[:space:]]*[:=][[:space:]]*"?[A-Za-z0-9_/+-]{24,}'
          )

          PATTERN_ERE=$(IFS='|'; echo "${PATTERNS[*]}")
          echo "Buscando firmas de secreto..."
          echo

          tmp_hits=$(mktemp)
          grep -RniE --binary-files=without-match \
                     --exclude="secret-scan.yml" \
                     --exclude="secret-scan-allowlist.txt" \
                     --exclude="*.example" \
                     --exclude=".env.example" \
                     --exclude-dir=.git \
                     --exclude-dir=node_modules \
                     -e "$PATTERN_ERE" . > "$tmp_hits" || true

          # Flag de ficheros .env REALES trackeados (no .example / .local que van en gitignore)
          git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '\.example$|\.local$' >> "$tmp_hits" || true

          if [ ! -s "$tmp_hits" ]; then
            echo "OK: no se detectaron secretos."
            exit 0
          fi

          if [ -f "$ALLOWLIST" ]; then
            grep -vFf "$ALLOWLIST" "$tmp_hits" > "$tmp_hits.filtered" || true
            mv "$tmp_hits.filtered" "$tmp_hits"
          fi

          if [ -s "$tmp_hits" ]; then
            echo "FAIL: posibles secretos encontrados (fuera de allowlist):"
            echo
            cat "$tmp_hits"
            echo
            echo "Rotá el secreto y arreglá la fuente. Si es un falso positivo"
            echo "legítimo, agregá la subcadena a $ALLOWLIST."
            exit 1
          fi

          echo "OK: todas las coincidencias estaban en allowlist."
