# Alyp Studio — OpenSSF Scorecard (análisis de seguridad de supply-chain)
#
# Corre semanal + en push a main + cuando cambian reglas de branch protection.
# Publica resultados a scorecard.dev y los sube a Code Scanning del repo.
#
# Subir SARIF en repos privados requiere GitHub Advanced Security. Por eso el
# job `analysis` se salta mientras el repo es privado; se activa solo al pasarlo
# a público. Las acciones van pineadas a SHA (lo verifica/actualiza Dependabot).

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 2"  # martes 07:20 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # requerido por upload-sarif
      id-token: write          # requerido para publicar a scorecard.dev
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd  # v3.27.0
        with:
          sarif_file: results.sarif
