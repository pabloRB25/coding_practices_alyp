# capacity.yaml — perfil de capacidad del ENTORNO (máquina/equipo), no doctrina.
# Instalar como ~/.claude/capacity.yaml y ajustar. El protocolo (SKILL.md) habla
# de tiers; este archivo dice qué modelo y qué límites tiene CADA tier en TU entorno.
version: 3                         # v3 = doctrina v3.0: Sonnet orquesta, Opus FIRMA
# ── El switch de reversión del rediseño v3.0 ────────────────────────────────
# Volver a `claude-opus-4-8` acá + revertir el commit del protocolo devuelve el
# sistema a v2.10 (loop Opus). Condición de reversión pre-acordada: si sube de
# forma sostenida la tasa de bugs post-merge o los ❌ de G3 en las primeras olas.
# Ver docs/adr/0001-loop-sonnet-validador-opus.md.
orquestador: claude-sonnet-5       # loop principal: rutea, descompone, corre G1-G3. NO firma.
tiers:
  juez: claude-fable-5             # SOLO vía agente `consultor` (invocación explícita)
  razonador: claude-opus-4-8       # FIRMANTE invocado: G0 (contratos de ola), riesgo 2, merge.
                                   # Ya no es el loop. Entra con contexto fresco y paquete
                                   # acotado; fuera de esos 3 puntos no toca el camino crítico.
  obrero: claude-sonnet-5          # = orquestador; y ejecución: implementación, research, review
  barato: claude-haiku-4-5         # búsquedas amplias, triage; fallback del local saturado
  # REQUISITO DURO del tier mecánico: tool calling ESTRUCTURADO (msg.tool_calls).
  # Sin él, el ejecutor no escribe nada y reporta éxito igual (falso positivo).
  # Verificalo con una llamada real; NO alcanza `capabilities: [tools]` de /api/show
  # (un modelo puede declararlo y aun así emitir la llamada como texto).
  # Medido en el equipo de referencia 2026-07-16: qwen2.5-coder:3b 0/5 → descartado
  # como ejecutor; qwen3:4b 4/4 con el mismo footprint (2.5 GB).
  mecanico_light: qwen3:4b         # local default — offloading OBLIGATORIO (null si no hay)
  mecanico_heavy: qwen3-coder:30b  # local con razonamiento, de a UNA (~19 GB, pagina el SO)
  qa: qwen2.5-coder:3b             # QA de hooks: NO necesita tool calling (devuelve prosa)
local:
  disponible: true                 # false → todo lo mecánico va a `barato` (cloud)
  max_delegaciones_vivas: 2        # = OLLAMA_NUM_PARALLEL; gobernador anti-estampida
  qa_hooks: true                   # hooks qa-review/supervise instalados
cloud:
  max_subagentes_por_ola: 10       # cap del harness en este entorno
  max_razonador_por_ola: 3         # dosificación del tier caro/lento
notas: >
  Valores medidos del entorno (RAM, tiempos, co-residencia de modelos) van acá,
  no en el protocolo. Referencia local: ~/local-llm-stack/ARCHITECTURE.md.
